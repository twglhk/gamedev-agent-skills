<!doctype html>
<!-- End title over the last frame. Render with ../scripts/render.py, opaque.
     window.MG: bg (last frame of the cut), title (game title; wrap a word or symbol in <em> for the accent),
     sub (small line under the title), top (% of height for the lockup),
     light, ink, accent (colours), display, sans (CSS font stacks).
     Beats at 30 fps: f0-8 frame dims · f2-12 band wipes in · f6-16 title rises · f12-20 accent stamps
     · f16-24 sub line · hold to the end (no exit: the video ends here). -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "DisplayCX"; src: local("Futura Condensed ExtraBold"), local("Futura-CondensedExtraBold"); }
  :root { --top: 40%; --light: #f2f2ee; --ink: #141414; --accent: #d23c3c;
          --display: "DisplayCX", "Oswald", "Bebas Neue", "Impact", sans-serif;
          --sans: "Helvetica Neue", "Inter", "Arial", sans-serif;
          --out4: cubic-bezier(.165, .84, .44, 1); --expo: cubic-bezier(.16, 1, .3, 1); }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  .L { position: absolute; inset: 0; }
  img.L { width: 100%; height: 100%; object-fit: cover; animation: dim .27s linear both; }
  @keyframes dim { to { filter: brightness(.45) saturate(.5); } }
  .tone { background-image: radial-gradient(rgba(0,0,0,.5) 22%, transparent 26%); background-size: 1.1vmin 1.1vmin;
          mix-blend-mode: multiply; animation: fadeIn .27s linear both; }
  .lock { top: var(--top); bottom: auto; display: flex; flex-direction: column; align-items: center; }
  .band { position: relative; width: 100%; background: var(--ink); padding: 2.4vmin 0 1.6vmin; text-align: center;
          box-shadow: 0 1.4vmin 0 var(--accent); clip-path: inset(0 100% -2vmin 0);
          animation: wipe .37s var(--expo) .07s both; }
  .mask { overflow: hidden; }
  .title { display: inline-block; font: 7.2vmin/1 var(--display); letter-spacing: .3vmin; white-space: nowrap; text-transform: uppercase;
           color: var(--light); transform: translateY(105%); animation: rise .33s var(--out4) .2s both; }
  .title em { display: inline-block; font-style: normal; color: var(--accent); transform: scale(0);
              animation: stamp .23s var(--out4) .4s both; }
  .sub { margin-top: 3.4vmin; font: 700 3.6vmin/1 var(--sans); letter-spacing: 1.1vmin; text-transform: uppercase;
         color: var(--light); opacity: 0; animation: fadeIn .27s linear .53s both; }
  @keyframes wipe { to { clip-path: inset(0 0 -2vmin 0); } }
  @keyframes rise { to { transform: translateY(0); } }
  @keyframes stamp { 0% { transform: scale(1.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style></head><body>
<img class="L" id="bg">
<div class="L tone"></div>
<div class="L lock">
  <div class="band"><div class="mask"><span class="title" id="title"></span></div></div>
  <div class="sub" id="sub"></div>
</div>
<script>
  const M = window.MG || {}, $ = id => document.getElementById(id), r = document.documentElement.style;
  if (M.top) r.setProperty("--top", M.top);
  for (const k of ["light", "ink", "accent", "display", "sans"]) if (M[k]) r.setProperty("--" + k, M[k]);
  $("bg").src = M.bg || "";
  $("title").innerHTML = M.title || "Game <em>Title</em>";
  $("sub").textContent = M.sub || "";
</script>
</body></html>
